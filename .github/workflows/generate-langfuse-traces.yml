name: Gerar traces Langfuse - Etapa 2

on:
  workflow_dispatch:
  push:
    paths:
      - "observability_tools/TRIGGER.txt"

jobs:
  traces:
    runs-on: ubuntu-latest
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas scikit-learn joblib "flaml[automl]==2.7.0" lightgbm xgboost langfuse chromadb sentence-transformers

      - name: Gerar 5 traces no Langfuse
        run: python observability_tools/generate_demo_traces.py
