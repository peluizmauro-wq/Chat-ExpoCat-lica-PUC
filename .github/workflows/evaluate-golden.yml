name: Avaliar Golden Dataset - Etapa 2

on:
  push:
    paths:
      - ".github/workflows/evaluate-golden.yml"
      - "avaliacao/**"
      - "assistant_engine.py"
      - "agents.py"
      - "database.py"
      - "rag_engine.py"
      - "ml_engine.py"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências mínimas
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas scikit-learn joblib "flaml[automl]==2.7.0" lightgbm xgboost

      - name: Executar avaliação
        run: python avaliacao/run_evaluation.py

      - name: Salvar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avaliacao/resultados
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Etapa 2: atualiza resultados do golden dataset"
            git push
          fi
