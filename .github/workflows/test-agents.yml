name: Testar agentes - Etapa 2

on:
  push:
    paths:
      - ".github/workflows/test-agents.yml"
      - "agents.py"
      - "assistant_engine.py"
      - "app.py"
      - "testes/test_agents.py"
      - "ml_engine.py"
      - "ml/model/**"

jobs:
  test-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências mínimas
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas scikit-learn joblib "flaml[automl]==2.7.0" lightgbm xgboost

      - name: Executar teste multiagente
        run: python testes/test_agents.py
