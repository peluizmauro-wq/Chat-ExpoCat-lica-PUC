name: Treinar modelo ML - Etapa 2

on:
  push:
    paths:
      - ".github/workflows/train-ml.yml"
      - "ml/train_model.py"
      - "ml/dados/german.data"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do treinamento
        run: |
          python -m pip install --upgrade pip
          pip install "flaml[automl]==2.7.0" pandas scikit-learn joblib lightgbm xgboost

      - name: Treinar e avaliar modelo
        run: python ml/train_model.py

      - name: Salvar modelo e métricas no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/model
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Etapa 2: atualiza modelo ML treinado e métricas"
            git push
          fi
